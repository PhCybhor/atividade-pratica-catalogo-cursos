databaseChangeLog:
  - changeSet:
      id: 001-01-create-instrutor
      author: catalogocursos
      comment: Cria a tabela de instrutores do catálogo de cursos.
      changes:
        - createTable:
            tableName: instrutor
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_instrutor
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: instrutor

  - changeSet:
      id: 001-02-uk-instrutor-email
      author: catalogocursos
      comment: Garante unicidade do e-mail do instrutor.
      changes:
        - addUniqueConstraint:
            tableName: instrutor
            columnNames: email
            constraintName: uk_instrutor_email
      rollback:
        - dropUniqueConstraint:
            tableName: instrutor
            constraintName: uk_instrutor_email
